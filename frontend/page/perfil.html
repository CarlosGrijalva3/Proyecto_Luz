<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil - WikiLuz</title>
    <link rel="stylesheet" href="../assets/css/perfil.css">
    <link rel="stylesheet" href="../assets/css/luciernagas.css">


    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>
    <div id="fondo-luciernagas" aria-hidden="true"></div> <!--Luciernagas-->

    <header class="header-nav">
        <div class="logo-container">
            <a href="wikiLuz.html">
                <img src="../assets/images/logo.png" alt="Logo" class="logo-img">
            </a>
        </div>
    </header>

    <main class="main-container">

        <!--  Perfil -->
        <section id="perfil" class="screen-section">

            <!-- Marco punteado exterior (Perfil Principal) -->
            <div class="perfil-dashed-frame">
                <div class="perfil-card">
                    <!-- Fila Superior: Campo de usuario, Lapiz de Editar y Boton Guardar -->
                    <div class="perfil-top-row">
                        <form id="form-perfil" class="perfil-form" onsubmit="return false;">
                            <div class="user-input-group">
                                <input type="text" id="input-usuario" value="vegeta77" class="input-perfil" disabled>
                                <button type="button" id="btn-editar" class="btn-action btn-edit" title="Editar">
                                    <i class="fas fa-pen"></i>
                                </button>
                                <button type="button" id="btn-guardar" class="btn-action btn-save" title="Guardar">
                                    guardar
                                </button>
                            </div>
                        </form>
                    </div>

                    <!-- Fila Inferior: Botón Borrar Cuenta -->
                    <div class="perfil-bottom-row">
                        <button type="button" id="btn-borrar-cuenta" class="btn-borrar">
                            Borrar cuenta
                        </button>
                    </div>
                </div>
            </div>

            <!-- Contenedorcálculos -->
            <div class="calculos-perfil-section">
                <h2 class="calculos-titulo">Mis calculos de iluminacion</h2>
                <div id="lista-calculos" class="lista-calculos">
                </div>
            </div>

        </section>

    </main>

    <script src="../assets/js/perfil.js"></script>
    <script src="../assets/js/luciernagas.js"></script>

</body>

</html>
